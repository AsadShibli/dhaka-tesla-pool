# Render Blueprint (free plans). Not deployed by us: it needs your Render account.
# After the first deploy, set API_URL on tesla-pool-web to the API's URL, e.g. https://tesla-pool-api.onrender.com
databases:
  - name: tesla-pool-db
    plan: free
    databaseName: tesla_pool
    user: tesla

services:
  - type: web
    name: tesla-pool-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4000"
      - key: API_PORT
        value: "4000"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tesla-pool-db
          property: connectionString

  - type: web
    name: tesla-pool-web
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./apps/web/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: API_URL
        sync: false
