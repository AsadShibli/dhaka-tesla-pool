# Render Blueprint (free plans). Matches the live deploy: Node runtime, Singapore, builds from the repo root
# so npm workspaces can link packages/domain. After the first deploy, set API_URL on tesla-pool-web
# to the API's public URL (Render adds a suffix, e.g. https://tesla-pool-api-xxxx.onrender.com).
databases:
  - name: tesla-pool-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: tesla_pool
    user: tesla

services:
  - type: web
    name: tesla-pool-api
    runtime: node
    plan: free
    region: singapore
    branch: master
    buildCommand: npm ci --workspace api --omit=dev
    # Migrations and the demo cast run first; a failed migration stops the start.
    startCommand: node apps/api/src/db/migrate.js && node apps/api/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: API_PORT
        value: "4000"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tesla-pool-db
          property: connectionString

  - type: web
    name: tesla-pool-web
    runtime: node
    plan: free
    region: singapore
    branch: master
    buildCommand: npm ci --workspace web --include=dev && npm run build --workspace web
    startCommand: npm run start --workspace web
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "3000"
      - key: API_URL
        sync: false
